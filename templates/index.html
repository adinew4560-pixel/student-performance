<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Performance Indicator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 20px;
        }
        h1 { font-size: 32px; margin-bottom: 16px; }
        p { font-size: 16px; margin-bottom: 28px; opacity: 0.9; }
        a.button {
            background: white;
            color: #667eea;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 16px;
            transition: transform 0.2s;
        }
        a.button:hover { transform: translateY(-2px); }
    </style>
</head>
<body>
    <h1>🎓 Student Performance Predictor</h1>
    <p>Predict a student's math score based on background and test scores.</p>
    <a class="button" href="{{ url_for('predict_datapoint') }}">Try the Predictor</a>
</body>
</html>
